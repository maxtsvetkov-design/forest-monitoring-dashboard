name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a push that lands mid-deploy waits
# rather than racing the one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

      # Project page (username.github.io/forest-monitoring-dashboard/) is
      # served from a subpath, so every asset URL the build emits needs that
      # prefix — see vite.config.ts's GITHUB_PAGES_BASE handling. Rename this
      # if the repo itself is ever renamed.
      - run: pnpm build
        env:
          GITHUB_PAGES_BASE: /forest-monitoring-dashboard/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
